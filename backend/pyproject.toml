[project]
name = "advanced-rag"
version = "1.0.0"
description = "Advanced RAG System — LangGraph + Milvus + Aliyun Bailei"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    "pydantic",
    "langchain",
    "langchain-openai",
    "langchain-community",
    "langgraph",
    "grandalf",
    "dashscope",
    "pymilvus",
    "minio",
    "pymongo",
    "magic-pdf",
    "python-dotenv",
    "loguru",
    "numpy",
    "pandas",
    "regex",
    "requests",
    "aiokafka",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
# 默认安静模式 + 全局告警过滤（starlette testclient 的 httpx 迁移告警与业务无关）
addopts = "-q"
# 只收集 tests/：test/ 目录是手工执行的图结构/端到端脚本，不属于单测
# （其内部若有 test_ 前缀函数，未来一旦命名撞上 pytest 规则会被误收集）
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
